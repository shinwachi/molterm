<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Molterm TUI Renderer{% endblock %}</title>
    <link rel="stylesheet" href="/static/house.css">
    <link rel="stylesheet" href="/static/molterm.css">
    <script>
        // remembered theme override (auto = follow the OS)
        try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    {% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
    <span class="brand">Molterm TUI Renderer</span>
    <span class="chip" id="env"><i></i>…</span>
    <span class="spacer"></span>
    <nav>
        <a class="btn quiet" href="/"{% if page == "renderer" %} aria-current="page"{% endif %}>Renderer</a>
        <a class="btn quiet" href="/demo"{% if page == "demo" %} aria-current="page"{% endif %}>Demo</a>
        <a class="btn quiet" href="/terminal"{% if page == "terminal" %} aria-current="page"{% endif %}>Terminal</a>
        <a class="btn quiet" href="/compare"{% if page == "compare" %} aria-current="page"{% endif %}>Compare</a>
        <a class="btn quiet" href="/kitty"{% if page == "kitty" %} aria-current="page"{% endif %}>Kitty</a>
        <a class="btn quiet" href="/health">Health</a>
    </nav>
    <button class="btn quiet" id="theme" title="Theme: auto, light or dark">auto</button>
</header>
<main>
{% block main %}{% endblock %}
</main>
<script src="/static/molterm.js"></script>
{% block script %}{% endblock %}
</body>
</html>
