# Static files only: the page in /srv/site, the libraries it loads in /srv/vendor.
server {
    listen 8940;
    root /srv/site;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json;

    gzip on;
    gzip_types application/javascript application/wasm application/json text/css image/svg+xml;
    gzip_min_length 1024;

    location /vendor/ {
        alias /srv/vendor/;
        expires 7d;
    }
    location = /health {
        default_type application/json;
        return 200 '{"service": "molterm-web", "status": "ok"}';
    }
}
